name: Build Pulse Board APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Clean Core
        run: |
          git clone --depth 1 https://github.com/Helium314/HeliBoard.git core
          shopt -s dotglob
          cp -rf core/* .
          rm -rf core

      - name: Set Clean App Name
        run: |
          find app/src/main/res -name "strings.xml" -exec sed -i 's/HeliBoard/Pulse Board/g' {} + 2>/dev/null || true

      - name: Setup BlackBerry Flick and Full Hindi Engine
        run: |
          find app/src/main/res -name "*donottranslate*.xml" | while read f; do
            sed -i 's/name="default_key_flick">false/name="default_key_flick">true/g' "$f" 2>/dev/null || true
            sed -i 's/name="config_swipe_to_delete">false/name="config_swipe_to_delete">true/g' "$f" 2>/dev/null || true
            sed -i 's/name="default_gesture_space_bar">false/name="default_gesture_space_bar">true/g' "$f" 2>/dev/null || true
            sed -i 's/name="default_include_number_row">false/name="default_include_number_row">true/g' "$f" 2>/dev/null || true
            sed -i 's/name="default_show_tool_bar">false/name="default_show_tool_bar">true/g' "$f" 2>/dev/null || true
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Compile Pulse Board APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Pulse Board APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Board-APK
          path: app/build/outputs/apk/debug/*.apk
          
